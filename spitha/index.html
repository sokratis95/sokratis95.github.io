<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7552">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Ccircle cx='26' cy='26' r='25' fill='%230E7552'/%3E%3Cpath d='M29 8 15 29h9l-3 15 15-22h-9z' fill='%23F2B705'/%3E%3C/svg%3E">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Σπίθα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Fira+Code:wght@400;500&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --soft:#E3ECE8; --ink:#0F221B; --muted:#51655C; --line:#D0DDD7;
  --accent:#0E7552; --accent-soft:#D9EFE6; --on-accent:#FFFFFF; --spark:#9A6A00; --spark-bg:#FFF3CF; --spark-mark:#F2B705;
  --ok:#1A7A43; --ok-soft:#DFF2E6; --bad:#B02A1E; --bad-soft:#FBE5E2;
  --resbody:#D8C49C; --lead:#8A949E;
  --b1:#7A4A2A; --b2:#C8312B; --b3:#E07B1F; --b4:#E6C11B; --b5:#2E8B3E; --b6:#2458C6; --b7:#7B45B8; --b8:#8A8F96; --b9:#F7F7F4; --gold:#C9A227;
  --display:"Commissioner","Fira Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:"Fira Sans",-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --mono:"Fira Code",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1411; --surface:#111F1A; --soft:#18291F; --ink:#E1EDE8; --muted:#93AAA0; --line:#23372E;
    --accent:#4DD3A0; --accent-soft:#143427; --on-accent:#0A1411; --spark:#FFCB45; --spark-bg:#2E260E; --spark-mark:#FFCB45;
    --ok:#63D293; --ok-soft:#12301F; --bad:#FF8F85; --bad-soft:#3A1713;
    --resbody:#7C6A48; --lead:#5D6873;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1411; --surface:#111F1A; --soft:#18291F; --ink:#E1EDE8; --muted:#93AAA0; --line:#23372E;
  --accent:#4DD3A0; --accent-soft:#143427; --on-accent:#0A1411; --spark:#FFCB45; --spark-bg:#2E260E; --spark-mark:#FFCB45;
  --ok:#63D293; --ok-soft:#12301F; --bad:#FF8F85; --bad-soft:#3A1713;
  --resbody:#7C6A48; --lead:#5D6873;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;padding-inline:16px;padding-block:0 56px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin-inline:auto}

.top{display:grid;grid-template-columns:1fr auto;gap:14px 32px;align-items:end;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:16px;align-items:center}
.logo{width:52px;height:52px;flex:none}
.brand h1{font-size:clamp(38px,6vw,54px);font-weight:800;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.meter{min-width:280px}
.meter-label{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
.meter-label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bands{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.bands i{height:16px;border-radius:3px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.bands i.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;padding-top:24px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr;align-items:center;gap:10px;padding:9px 10px;min-height:44px;border-radius:8px;color:var(--ink)}
.nav button:hover{background:var(--soft)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav .nt{font-weight:500;font-size:15px;line-height:1.25}
.nav .ns{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.nav .ns.pass{color:var(--ok);font-weight:500}
.nav hr{border:0;border-top:1px solid var(--line);margin:6px 10px}
.navicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);margin-inline:auto;color:var(--muted)}
.navicon svg{width:16px;height:16px}

.res{position:relative;width:26px;height:11px;border-radius:5px;background:var(--resbody);margin-inline:7px;flex:none;display:inline-block;vertical-align:middle}
.res::before,.res::after{content:"";position:absolute;top:4.5px;width:7px;height:2px;background:var(--lead)}
.res::before{left:-7px}.res::after{right:-7px}
.res i{position:absolute;top:0;bottom:0;left:10px;width:6px;background:var(--band);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

main{min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.chh h2{font-size:clamp(30px,4.6vw,44px);margin-top:10px;letter-spacing:-.01em}
.lede{font-size:17.5px;max-width:64ch;margin:12px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.pass{background:var(--ok-soft);color:var(--ok)}
section{margin-top:34px}
h3{font-size:22px;margin-bottom:12px}
h3 small{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted);margin-left:8px}

.fact{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--spark-bg);border-radius:10px;padding:14px 18px;max-width:75ch;margin-top:20px}
.fact svg{width:26px;height:26px;margin-top:2px}
.fact b{display:block;font-family:var(--display);font-size:15px;color:var(--spark);margin-bottom:2px}
.fact p{margin:0}

.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.obj{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.obj li{display:grid;grid-template-columns:20px 1fr;gap:8px;max-width:62ch}
.obj li::before{content:"";width:9px;height:9px;margin-top:9px;border:2px solid var(--accent);border-radius:50%}
.formulas{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.formulas h3{font-size:18px}
.formulas dl{margin:0;display:grid;gap:10px}
.formulas dt{font-family:var(--mono);font-size:15px;font-weight:500}
.formulas dd{margin:1px 0 0;font-size:14px;color:var(--muted)}

.groups{display:grid;gap:22px}
.group h4{margin:0 0 8px;font-family:var(--display);font-size:15px;color:var(--accent);font-weight:700}
.items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.items li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.items .it{font-weight:600}
.items .it a{text-decoration:none}
.items .it a:hover{text-decoration:underline}
.items .src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px}
.lang{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.5}
.lang.el{color:var(--accent)}
.lang.en{color:var(--muted)}
.items .note{margin:4px 0 0;font-size:15px;max-width:70ch}
.items li.done .it,.items li.done .it a{color:var(--muted)}

.callout{border-left:3px solid var(--spark-mark);background:var(--surface);padding:14px 18px;border-radius:0 10px 10px 0;max-width:75ch}
.callout p{margin:0}

.test{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.testhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:6px}
.testhead h3{margin:0}
.testmeta{font-size:14px;color:var(--muted)}
.qs{display:grid;gap:20px;margin-top:18px}
fieldset.q{border:0;margin:0;padding:18px 0 0;border-top:1px solid var(--line);min-width:0}
.q legend{float:left;width:100%;padding:0;font-weight:600;font-size:16.5px;display:grid;grid-template-columns:40px 1fr;max-width:75ch}
.q legend .qn{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:14px;padding-top:2px}
.opts{clear:both;display:grid;gap:8px;margin:0 0 0 40px;padding-top:12px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:11px 14px;min-height:48px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.graded .opt{cursor:default}
.graded .opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{font-size:12px;font-weight:700;margin-left:8px;white-space:nowrap}
.opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.expl{margin:10px 0 0 40px;font-size:15px;padding:12px 14px;border-radius:8px;background:var(--soft);max-width:75ch}
.expl b{font-weight:600}
.expl.ok b{color:var(--ok)}.expl.no b{color:var(--bad)}
.testfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:8px;padding:12px 22px;min-height:48px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.result{margin-top:16px;padding:16px 18px;border-radius:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.result.pass{background:var(--ok-soft)}.result.fail{background:var(--spark-bg)}
.result .big{font-family:var(--display);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.result.pass .big{color:var(--ok)}.result.fail .big{color:var(--spark)}
.result p{margin:0;flex:1 1 240px}

.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:32px}
.pager button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;padding:10px 0;min-height:24px}
.pager button:hover{text-decoration:underline}
.pager button:focus-visible{outline:2px solid var(--accent)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.steps b{display:block;font-family:var(--display);font-size:19px;font-weight:700;margin:2px 0 4px}
.steps span{font-size:14.5px;color:var(--muted)}
.steps .k{font-family:var(--mono);font-size:12.5px;color:var(--spark);font-weight:500}
.tips{margin:0;padding-left:20px;display:grid;gap:8px;max-width:72ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:13px;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.chname{display:flex;align-items:center;gap:10px;font-weight:600}
.chname small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.gloss div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:15px}
.gloss div:nth-child(-n+3){border-top:0}
.gloss span{color:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:2px}

@media (max-width:900px){
  .top{grid-template-columns:1fr}
  .meter{min-width:0}
  .layout{grid-template-columns:1fr;gap:18px;padding-top:14px}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:8px}
  .nav hr{display:none}
  .nav button{grid-template-columns:auto;justify-items:center;gap:4px;padding:8px;min-width:84px;text-align:center}
  .nav .nt{font-size:13.5px}
  .nav .nt .full{display:none}
  .nav .ns{font-size:11.5px}
  .two{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gloss{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gloss div:nth-child(3){border-top:1px solid var(--line)}
}
@media (min-width:901px){ .nav .nt .short{display:none} }
@media (max-width:520px){
  .steps{grid-template-columns:1fr}
  .gloss{grid-template-columns:1fr}
  .gloss div:nth-child(2){border-top:1px solid var(--line)}
  .opts,.expl{margin-left:0}
  .test{padding:16px}
  .logo{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25" fill="var(--accent)"/><path d="M29 8 15 29h9l-3 15 15-22h-9z" fill="var(--spark-mark)"/></svg>
      <div>
        <h1>Σπίθα</h1>
        <p>Μάθε τον ηλεκτρισμό από την αρχή, με τον δικό σου ρυθμό. Εννιά κεφάλαια με βιβλία, βίντεο, προσομοιώσεις και ένα τεστ στο τέλος του καθενός.</p>
      </div>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-label"><span>Η πρόοδός σου</span><b id="meterText">0 από 9</b></div>
      <div class="bands" id="bands"></div>
    </div>
  </header>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Κεφάλαια"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
// ---------- Δεδομένα προγράμματος ----------
const GG = "https://ebooks.edu.gr/ebooks/v/html/8547/2226/Fysiki_G-Gymnasiou_html-empl/";      // Φυσική Γ' Γυμνασίου
const BL = "https://ebooks.edu.gr/ebooks/v/html/8547/2682/Fysiki_B-Lykeiou-GP_html-empl/";     // Φυσική Β' Λυκείου ΓΠ
const GL = "https://ebooks.edu.gr/ebooks/v/html/8547/4710/Fysiki-Teuxos-A_G-Lykeiou-ThSp-SpYg_html-empl/"; // Φυσική Γ' Λυκείου (Τεύχος Α)
const PHET = "https://phet.colorado.edu/el/simulations/";
const YT = "https://www.youtube.com/watch?v=";
const RONT = "Rontoulis Aris · YouTube";
const FALSTAD = "https://www.falstad.com/circuit/";

const CHAPTERS = [
{
  id: "k1", n: 1, title: "Ηλεκτρικό φορτίο", short: "Στατικός ηλεκτρισμός, αγωγοί, μονωτές",
  sessions: 4,
  lede: "Όλα ξεκινούν από κάτι πολύ μικρό: το ηλεκτρόνιο. Σε αυτό το κεφάλαιο μαθαίνεις τι είναι το ηλεκτρικό φορτίο, γιατί ένα μπαλόνι κολλάει στον τοίχο αφού το τρίψεις στα μαλλιά σου, και γιατί κάποια υλικά αφήνουν τον ηλεκτρισμό να περάσει ενώ άλλα όχι.",
  fact: "Η λέξη «ηλεκτρισμός» είναι ελληνική. Γύρω στο 600 π.Χ. ο Θαλής ο Μιλήσιος παρατήρησε ότι το κεχριμπάρι, όταν το τρίψεις, τραβάει μικρά κομμάτια άχυρο. Οι αρχαίοι έλεγαν το κεχριμπάρι «ήλεκτρον».",
  objectives: [
    "Να εξηγείς τι είναι το ηλεκτρικό φορτίο και ποια σωματίδια το έχουν",
    "Να περιγράφεις πώς φορτίζεται ένα σώμα με τριβή, επαφή και επαγωγή",
    "Να προβλέπεις πότε δύο φορτία έλκονται και πότε απωθούνται",
    "Να ξεχωρίζεις αγωγούς από μονωτές με παραδείγματα",
    "Να χρησιμοποιείς απλά τον νόμο του Coulomb"
  ],
  formulas: [
    ["q", "Φορτίο, σε κουλόμπ (C)"],
    ["e = 1,6 × 10⁻¹⁹ C", "Το φορτίο ενός ηλεκτρονίου (αρνητικό)"],
    ["F = k · q₁ · q₂ / r²", "Νόμος του Coulomb, k ≈ 9 × 10⁹"]
  ],
  read: [
    { t: "Κεφάλαιο 1: Ηλεκτρισμός", s: "Φυσική Γ' Γυμνασίου · σχολικό βιβλίο", u: GG + "index1.html", l: "el", n: "Όλο το κεφάλαιο (1.1–1.5). Είναι γραμμένο απλά και έχει πολλές εικόνες." },
    { t: "1.1 Νόμος του Coulomb", s: "Φυσική Β' Λυκείου · σχολικό βιβλίο", u: BL + "index1_1.html", l: "el", n: "Προαιρετικό. Το ίδιο θέμα με λίγα περισσότερα μαθηματικά." }
  ],
  watch: [
    { t: "Ηλεκτρικό φορτίο (Εισαγωγή)", s: RONT, u: YT + "T_YSNLfn7RM", l: "el", n: "Ξεκίνα από εδώ." },
    { t: "Λίστα: Ηλεκτρική δύναμη και φορτίο", s: RONT + " · 12 βίντεο", u: "https://www.youtube.com/playlist?list=PLTM6qN0B6w_30_1Ds3vdFChuV_LX-0scL", l: "el", n: "Όλο το κεφάλαιο της Γ' Γυμνασίου σε μικρά βίντεο. Δες ένα ή δύο σε κάθε μελέτη." },
    { t: "Διαδραστικό βιβλίο: Ηλεκτρισμός", s: "YouTube · λίστα βίντεο", u: "https://www.youtube.com/playlist?list=PLZc_wWHBOK4B86B_MqpzhY2plUBbA6mh6", l: "el", n: "Εναλλακτικές εξηγήσεις, αν κάτι δεν έγινε κατανοητό." }
  ],
  practice: [

const FINAL = {

    { q: "Δύο αντιστάτες των 10 Ω: πόση είναι η ολική αντίσταση σε σειρά και πόση παράλληλα;", o: ["20 Ω και 5 Ω", "5 Ω και 20 Ω", "10 Ω και 10 Ω", "20 Ω και 20 Ω"], a: 0, e: "Σε σειρά προστίθενται: 10 + 10 = 20 Ω. Παράλληλα, δύο ίσοι δίνουν τη μισή τιμή: 5 Ω." },
    { q: "Ένα κλιματιστικό 1 kW δουλεύει 8 ώρες την ημέρα για 30 ημέρες. Με 0,20 € την kWh, πόσο κοστίζει;", o: ["4,80 €", "48 €", "240 €", "1,60 €"], a: 1, e: "Ενέργεια: 1 kW × 8 h × 30 = 240 kWh. Κόστος: 240 × 0,20 € = 48 €." },

    { q: "Γιατί δίπλα σε έναν σταθμό παραγωγής υπάρχει μετασχηματιστής ανύψωσης τάσης;", o: ["Για να μειωθεί το ρεύμα στις γραμμές μεταφοράς και να χάνεται λιγότερη ενέργεια", "Για να αυξηθεί η συχνότητα", "Για να γίνει το ρεύμα συνεχές", "Για να είναι πιο ασφαλές για τους περαστικούς"], a: 0, e: "Με ίδια ισχύ, υψηλότερη τάση σημαίνει μικρότερο ρεύμα, και οι απώλειες (I² · R) πέφτουν δραματικά." },
    { q: "Όταν ένα ηλεκτρικό πατίνι φρενάρει, μπορεί να φορτίσει λίγο τη μπαταρία του. Πώς;", o: ["Τα φρένα ζεσταίνονται και η θερμότητα γίνεται ρεύμα", "Ο κινητήρας δουλεύει ανάποδα ως γεννήτρια: η κίνηση γίνεται ηλεκτρική ενέργεια με επαγωγή", "Η μπαταρία φορτίζεται από τον αέρα", "Δεν γίνεται αυτό"], a: 1, e: "Κινητήρας και γεννήτρια είναι ουσιαστικά η ίδια μηχανή. Στο φρενάρισμα ο κινητήρας γίνεται γεννήτρια, φρενάρει το πατίνι και στέλνει ενέργεια στη μπαταρία. Λέγεται ανακτητική πέδηση." },
    { q: "Ένα εναλλασσόμενο ρεύμα έχει περίοδο 20 ms. Πόση είναι η συχνότητά του;", o: ["20 Hz", "50 Hz", "200 Hz", "0,05 Hz"], a: 1, e: "f = 1 / T = 1 / 0,02 s = 50 Hz, όπως το δίκτυο στην Ελλάδα." },
    { q: "Με την ίδια τάση, διπλασιάζεις την αντίσταση ενός κυκλώματος. Τι γίνεται το ρεύμα;", o: ["Διπλασιάζεται", "Γίνεται το μισό", "Μένει ίδιο", "Τετραπλασιάζεται"], a: 1, e: "I = V / R. Διπλάσια αντίσταση, μισό ρεύμα." },
    { q: "Γιατί δεν αρκεί η απλή ασφάλεια (μικροαυτόματος) για να προστατέψει έναν άνθρωπο από ηλεκτροπληξία;", o: ["Γιατί πέφτει μόνο με πολύ μεγάλα ρεύματα (π.χ. 16 A), ενώ λίγα mA μέσα από το σώμα είναι ήδη επικίνδυνα", "Γιατί δουλεύει μόνο με συνεχές ρεύμα", "Γιατί είναι πολύ γρήγορη", "Αρκεί"], a: 0, e: "Η ασφάλεια είναι φτιαγμένη για να προστατεύει τα καλώδια από μεγάλα ρεύματα. Για τους ανθρώπους χρειάζεται το ρελέ διαφυγής, που αντιδρά σε 30 mA." },
    { q: "Συνδέεις ένα LED ανάποδα σε ένα σωστό κατά τα άλλα κύκλωμα. Τι γίνεται;", o: ["Ανάβει με άλλο χρώμα", "Δεν ανάβει, γιατί είναι δίοδος και δεν αφήνει ρεύμα προς αυτή την κατεύθυνση", "Ανάβει πιο δυνατά", "Εκρήγνυται αμέσως"], a: 1, e: "Το LED είναι δίοδος: περνά ρεύμα μόνο προς μία κατεύθυνση. Ανάποδα απλώς μένει σβηστό (με χαμηλές τάσεις δεν παθαίνει τίποτα)." },
    { q: "Τι μετράει ο μετρητής ρεύματος του σπιτιού, με βάση το οποίο πληρώνεις λογαριασμό;", o: ["Την τάση (V)", "Την ενέργεια που καταναλώθηκε (kWh)", "Την ισχύ της μεγαλύτερης συσκευής (W)", "Τα αμπέρ της γενικής ασφάλειας"], a: 1, e: "Πληρώνεις για ενέργεια, σε κιλοβατώρες. Μια συσκευή υψηλής ισχύος που δουλεύει λίγο μπορεί να κοστίζει λιγότερο από μια μικρή που δουλεύει συνέχεια." },
    { q: "Αντικαθιστάς 3 λάμπες των 60 W με 3 LED των 8 W. Είναι αναμμένες 5 ώρες την ημέρα. Πόση ενέργεια γλιτώνεις κάθε μέρα;", o: ["0,78 kWh", "0,26 kWh", "0,9 kWh", "7,8 kWh"], a: 0, e: "Κάθε λάμπα γλιτώνει 60 − 8 = 52 W. Για 3 λάμπες: 156 W. Σε 5 ώρες: 780 Wh = 0,78 kWh την ημέρα, περίπου 285 kWh τον χρόνο." },
    { q: "Τι μετατροπή ενέργειας κάνει ένα φωτοβολταϊκό πάνελ;", o: ["Θερμότητα σε ηλεκτρική", "Φως σε ηλεκτρική (συνεχές ρεύμα)", "Κίνηση σε ηλεκτρική", "Ηλεκτρική σε φως"], a: 1, e: "Τα φωτοβολταϊκά είναι φτιαγμένα από ημιαγωγούς, όπως οι δίοδοι. Όταν πέφτει φως, απελευθερώνονται ηλεκτρόνια και δημιουργείται συνεχές ρεύμα, χωρίς κινούμενα μέρη." }
  ]
};

</script>
<script>
(function(){
const PASS = 0.7;
const BANDS = ["", "var(--b1)","var(--b2)","var(--b3)","var(--b4)","var(--b5)","var(--b6)","var(--b7)","var(--b8)","var(--b9)"];
const COLOR_NAMES = ["", "καφέ","κόκκινο","πορτοκαλί","κίτρινο","πράσινο","μπλε","μωβ","γκρι","λευκό"];
const ALL = CHAPTERS.concat([FINAL]);
const byId = Object.fromEntries(ALL.map(c => [c.id, c]));

const store = {
  get(k, d){ try { const v = localStorage.getItem("spitha." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("spitha." + k, JSON.stringify(v)); } catch(e){} }
};
let best = store.get("best", {});
let done = store.get("done", {});
const attempts = {};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const res = n => `<span class="res" style="--band:${n ? BANDS[n] : "var(--gold)"}" aria-hidden="true"><i></i></span>`;
const passed = id => best[id] && best[id].s / best[id].t >= PASS;
const started = c => best[c.id] || Object.keys(done).some(k => k.startsWith(c.id + ":") && done[k]);
const bolt = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-2 8 10-13h-6z" fill="var(--spark-mark)"/></svg>`;
const home = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z" fill="currentColor"/></svg>`;

function statusText(c){
  if (passed(c.id)) return {t: `Πέρασες · ${best[c.id].s}/${best[c.id].t}`, cls: "pass"};
  if (best[c.id]) return {t: `Καλύτερο ${best[c.id].s}/${best[c.id].t}`, cls: ""};
  if (started(c)) return {t: "Σε εξέλιξη", cls: ""};
  return {t: "Δεν ξεκίνησε", cls: ""};
}

function renderMeter(){
  const n = CHAPTERS.filter(c => passed(c.id)).length;
  const f = passed("final");
  document.getElementById("meterText").textContent = `${n} από 9 κεφάλαια${f ? " · τελικό τεστ ✓" : ""}`;
  document.getElementById("bands").innerHTML = CHAPTERS.map(c =>
    `<i class="${passed(c.id) ? "on" : ""}" style="${passed(c.id) ? `background:${BANDS[c.n]}` : ""}" title="Κεφάλαιο ${c.n}: ${esc(c.title)}"></i>`
  ).join("") + `<i class="${f ? "on" : ""}" style="${f ? "background:var(--gold)" : ""}" title="Τελικό τεστ"></i>`;
}

function renderNav(cur){
  const item = (id, icon, full, short, st) =>
    `<button type="button" data-go="${id}" ${cur === id ? 'aria-current="page"' : ""}>${icon}<span class="nt"><span class="full">${full}</span><span class="short">${short}</span>${st ? `<span class="ns ${st.cls}">${st.t}</span>` : ""}</span></button>`;
  let h = item("arxi", `<span class="navicon">${home}</span>`, "Αρχή", "Αρχή", null);
  h += "<hr>";
  h += CHAPTERS.map(c => item(c.id, res(c.n), `${c.n}. ${esc(c.title)}`, `Κεφ. ${c.n}`, statusText(c))).join("");
  h += "<hr>";
  h += item("final", res(0), "Τελικό τεστ", "Τελικό", statusText(FINAL));
  const nav = document.getElementById("nav");
  nav.innerHTML = h;
  const act = nav.querySelector('[aria-current="page"]');
  if (act && window.matchMedia("(max-width:900px)").matches) act.scrollIntoView({block: "nearest", inline: "center"});
}

const GLOSS = [["τάση","voltage"],["ρεύμα","current"],["αντίσταση","resistance"],["ισχύς","power"],["ενέργεια","energy"],["φορτίο","charge"],["κύκλωμα","circuit"],["σε σειρά","in series"],["παράλληλα","in parallel"],["πηνίο","coil"],["μετασχηματιστής","transformer"],["γεννήτρια","generator"],["κινητήρας","motor"],["πυκνωτής","capacitor"],["αντιστάτης","resistor"],["δίοδος","diode"],["γείωση","ground / earth"],["εναλλασσόμενο","alternating (AC)"]];

function renderHome(){
  const total = CHAPTERS.reduce((a, c) => a + c.sessions, 0);
  const rows = CHAPTERS.map(c => {
    const st = statusText(c);
    return `<tr data-go="${c.id}"><td><div class="chname">${res(c.n)}<div>${c.n}. ${esc(c.title)}<small>${esc(c.short)}</small></div></div></td>
      <td class="num">${c.sessions} μελέτες</td><td><span class="pill ${st.cls}">${st.t}</span></td></tr>`;
  }).join("");
  const fst = statusText(FINAL);
  return `
  <div class="chh">
    <div class="eyebrow">Ξεκίνα από εδώ</div>
    <h2>Από το κεχριμπάρι του Θαλή μέχρι την πρίζα</h2>
    <p class="lede">Γεια σου! Αυτό το πρόγραμμα σε οδηγεί βήμα βήμα στον κόσμο του ηλεκτρισμού: από το τι είναι ένα ηλεκτρόνιο μέχρι το πώς δουλεύει το tablet που κρατάς. Δεν υπάρχει προθεσμία και δεν μπορείς να χαλάσεις τίποτα. Προχώρα με τον ρυθμό σου.</p>
  </div>

  <section>
    <h3>Πώς δουλεύει κάθε κεφάλαιο</h3>
    <ol class="steps">
      <li><span class="k">1 · ΔΙΑΒΑΣΕ</span><b>Το βιβλίο</b><span>Σελίδες από τα σχολικά βιβλία Φυσικής, δωρεάν στο διαδίκτυο.</span></li>
      <li><span class="k">2 · ΔΕΣ</span><b>Τα βίντεο</b><span>Μαθήματα από Έλληνες καθηγητές και μερικά καλά αγγλικά βίντεο.</span></li>
      <li><span class="k">3 · ΔΟΚΙΜΑΣΕ</span><b>Τις προσομοιώσεις</b><span>Φτιάξε κυκλώματα και πειράματα μέσα στο tablet, χωρίς κανέναν κίνδυνο.</span></li>
      <li><span class="k">4 · ΤΕΣΤ</span><b>Δες τι έμαθες</b><span>10 ερωτήσεις με εξηγήσεις. Περνάς με 7/10. Ξαναδοκίμασε όσες φορές θέλεις.</span></li>
    </ol>
  </section>

  <section>
    <h3>Μερικές συμβουλές</h3>
    <ul class="tips">
      <li><b>Μικρές μελέτες.</b> 20 με 30 λεπτά είναι αρκετά. Κάθε κεφάλαιο χωράει σε 4–5 τέτοιες μελέτες.</li>
      <li><b>Τσέκαρε ό,τι τελειώνεις.</b> Η σελίδα θυμάται τι έχεις κάνει και τους βαθμούς σου σε αυτό το tablet.</li>
      <li><b>Κράτα ένα τετράδιο.</b> Γράψε τους τύπους και λύσε τις ασκήσεις με το χέρι πριν δεις την απάντηση.</li>
      <li><b>Αγγλικά βίντεο;</b> Στο YouTube πάτα το ⚙ → Υπότιτλοι → Αυτόματη μετάφραση → Ελληνικά.</li>
      <li><b>Κάποιος σύνδεσμος δεν ανοίγει;</b> Προχώρα στον επόμενο. Κάθε κεφάλαιο έχει αρκετές πηγές.</li>
      <li><b>Για γρήγορη πρόσβαση:</b> στο Chrome πάτα ⋮ → «Προσθήκη στην αρχική οθόνη» και η σελίδα θα ανοίγει σαν εφαρμογή.</li>
    </ul>
  </section>

  <section>
    <h3>Τα κεφάλαια</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Κεφάλαιο</th><th>Διάρκεια</th><th>Κατάσταση</th></tr></thead>
      <tbody>${rows}
        <tr data-go="final"><td><div class="chname">${res(0)}<div>Τελικό τεστ<small>15 ερωτήσεις από όλα τα κεφάλαια</small></div></div></td><td class="num">1 μελέτη</td><td><span class="pill ${fst.cls}">${fst.t}</span></td></tr>
      </tbody>
      <tfoot><tr><td>Σύνολο</td><td class="num">${total + 1} μελέτες</td><td></td></tr></tfoot>
    </table></div>
    <div class="legend"><span>Τα χρώματα των κεφαλαίων ακολουθούν τον χρωματικό κώδικα των αντιστατών (θα τον μάθεις στο κεφάλαιο 9):</span>${CHAPTERS.map(c => `<span>${res(c.n)}${c.n} ${COLOR_NAMES[c.n]}</span>`).join("")}<span>${res(0)}χρυσό (τελικό)</span></div>
  </section>

  <section>
    <h3>Μικρό λεξικό <small>για τα αγγλικά βίντεο</small></h3>
    <div class="gloss">${GLOSS.map(g => `<div><b>${g[0]}</b><span>${g[1]}</span></div>`).join("")}</div>
  </section>

  <section>
    <div class="callout"><p><b>Ένας κανόνας που δεν σπάει ποτέ:</b> όλα τα πειράματα αυτού του προγράμματος γίνονται μέσα στο tablet. Το ρεύμα της πρίζας (230 V) μπορεί να σκοτώσει. Δεν ανοίγουμε ποτέ πρίζες, φις ή συσκευές που είναι στο ρεύμα.</p></div>
  </section>

  <div class="pager"><span></span><button type="button" data-go="k1">Ξεκίνα με το Κεφάλαιο 1: Ηλεκτρικό φορτίο →</button></div>`;
}

function itemList(c, kind, list){
  return `<ul class="items">${list.map((r, i) => {
    const key = `${c.id}:${kind}:${i}`;
    const id = `chk-${c.id}-${kind}-${i}`;
    const title = r.u ? `<a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)} ↗</a>` : esc(r.t);
    const lang = r.l === "en" ? `<span class="lang en" title="Στα αγγλικά">EN</span>` : `<span class="lang el" title="Στα ελληνικά">ΕΛ</span>`;
    return `<li class="${done[key] ? "done" : ""}"><input type="checkbox" id="${id}" data-key="${key}" ${done[key] ? "checked" : ""} aria-label="Ολοκλήρωσα: ${esc(r.t)}">
      <div><span class="it">${title}</span><span class="src">${lang}${esc(r.s)}</span>${r.n ? `<p class="note">${esc(r.n)}</p>` : ""}</div></li>`;
  }).join("")}</ul>`;
}

function renderChapter(c){
  const st = statusText(c);
  const prev = CHAPTERS[c.n - 2], next = CHAPTERS[c.n] || FINAL;
  return `
  <article class="chh">
    <div class="eyebrow">${res(c.n)} Κεφάλαιο ${c.n} από 9 · περίπου ${c.sessions} μελέτες <span class="pill ${st.cls}">${st.t}</span></div>
    <h2>${esc(c.title)}</h2>
    <p class="lede">${esc(c.lede)}</p>
    <div class="fact">${bolt}<div><b>Ήξερες ότι;</b><p>${esc(c.fact)}</p></div></div>

    <section class="two">
      <div><h3>Στο τέλος θα μπορείς να…</h3><ul class="obj">${c.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
      <aside class="formulas"><h3>Τύποι και μονάδες</h3><dl>${c.formulas.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl></aside>
    </section>

    <section>
      <h3>Πρόγραμμα μελέτης <small>τσέκαρε ό,τι τελειώνεις</small></h3>
      <div class="groups">
        <div class="group"><h4>Διάβασε</h4>${itemList(c, "read", c.read)}</div>
        <div class="group"><h4>Δες</h4>${itemList(c, "watch", c.watch)}</div>
        <div class="group"><h4>Δοκίμασε</h4>${itemList(c, "practice", c.practice)}</div>
      </div>
    </section>

    <section id="test-${c.id}">${renderTest(c)}</section>

    <div class="pager">
      ${prev ? `<button type="button" data-go="${prev.id}">← ${prev.n}. ${esc(prev.title)}</button>` : `<button type="button" data-go="arxi">← Αρχή</button>`}
      <button type="button" data-go="${next.id}">${next.n ? `${next.n}. ${esc(next.title)}` : "Τελικό τεστ"} →</button>
    </div>
  </article>`;
}

function renderFinal(){
  const st = statusText(FINAL);
  return `
  <article class="chh">
    <div class="eyebrow">${res(0)} Τελικό τεστ · όλα τα κεφάλαια <span class="pill ${st.cls}">${st.t}</span></div>
    <h2>Τελικό τεστ</h2>
    <p class="lede">Δεκαπέντε ερωτήσεις που ενώνουν όλα όσα έμαθες: ενέργεια και κόστος, κυκλώματα, επαγωγή, δίκτυο, ασφάλεια και ηλεκτρονικά. Κάν' το όταν έχεις περάσει και τα εννιά κεφάλαια. Περνάς με 11/15.</p>
    <section id="test-final">${renderTest(FINAL)}</section>
    <div class="pager"><button type="button" data-go="k9">← 9. Ηλεκτρονικά</button><button type="button" data-go="arxi">Αρχή →</button></div>
  </article>`;
}

function shuffle(n){ const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function getAttempt(c){
  if (!attempts[c.id]) attempts[c.id] = { order: c.test.map(q => shuffle(q.o.length)), ans: {}, graded: false };
  return attempts[c.id];
}

function renderTest(c){
  const A = getAttempt(c);
  const total = c.test.length, need = Math.ceil(total * PASS);
  const bestTxt = best[c.id] ? `Καλύτερο σκορ: ${best[c.id].s}/${best[c.id].t}` : "Δεν το έχεις δοκιμάσει ακόμα";
  let score = 0;
  const qs = c.test.map((q, qi) => {
    const chosen = A.ans[qi];
    const ok = chosen === q.a;
    if (A.graded && ok) score++;
    const opts = A.order[qi].map(oi => {
      const id = `q-${c.id}-${qi}-${oi}`;
      let cls = "opt", tag = "";
      if (A.graded){
        if (oi === q.a){ cls += " right"; tag = `<span class="tag">✓ Σωστό</span>`; }
        else if (oi === chosen){ cls += " wrong"; tag = `<span class="tag">Η απάντησή σου</span>`; }
      }
      return `<label class="${cls}" for="${id}"><input type="radio" id="${id}" name="q-${c.id}-${qi}" value="${oi}" ${chosen === oi ? "checked" : ""} ${A.graded ? "disabled" : ""}><span>${esc(q.o[oi])}${tag}</span></label>`;
    }).join("");
    const expl = A.graded ? `<div class="expl ${ok ? "ok" : "no"}"><b>${ok ? "Σωστά!" : chosen == null ? "Δεν απάντησες." : "Όχι ακριβώς."}</b> ${esc(q.e)}</div>` : "";
    return `<fieldset class="q"><legend><span class="qn">${qi + 1}.</span><span>${esc(q.q)}</span></legend><div class="opts">${opts}</div>${expl}</fieldset>`;
  }).join("");

  const answered = Object.keys(A.ans).length;
  let result = "";
  if (A.graded){
    const pass = score >= need;
    const next = c.n ? (CHAPTERS[c.n] || FINAL) : null;
    const msg = pass
      ? (c.id === "final" ? "Ολοκλήρωσες όλο το πρόγραμμα. Μπράβο σου, τώρα ξέρεις πώς δουλεύει ο ηλεκτρισμός!" : `Μπράβο! ${next ? `Πάμε στο ${next.n ? `Κεφάλαιο ${next.n}: ${esc(next.title)}` : "τελικό τεστ"}.` : ""}`)
      : `Χρειάζεσαι ${need} για να περάσεις. Διάβασε τις εξηγήσεις παρακάτω, ξαναδές ό,τι σε δυσκόλεψε, και δοκίμασε ξανά. Οι απαντήσεις ανακατεύονται κάθε φορά.`;
    result = `<div class="result ${pass ? "pass" : "fail"}"><span class="big">${score}/${total}</span><p><b>${pass ? "Πέρασες!" : "Σχεδόν!"}</b> ${msg}</p><button type="button" class="btn ghost" data-retake="${c.id}">Ξανά το τεστ</button></div>`;
  }

  return `<div class="test ${A.graded ? "graded" : ""}" data-test="${c.id}">
    <div class="testhead"><h3>${c.id === "final" ? "Τελικό τεστ" : "Τεστ κεφαλαίου"}</h3><span class="testmeta">${total} ερωτήσεις · περνάς με ${need}/${total} · ${bestTxt}</span></div>
    ${result}
    <div class="qs">${qs}</div>
    <div class="testfoot">
      <span class="count" id="count-${c.id}">${A.graded ? `Σκορ ${score}/${total}` : `Απάντησες ${answered} από ${total}`}</span>
      ${A.graded ? `<button type="button" class="btn ghost" data-retake="${c.id}">Ξανά το τεστ</button>` : `<button type="button" class="btn" data-grade="${c.id}">Βαθμολόγησέ με</button>`}
    </div>
  </div>`;
}

function grade(id){
  const c = byId[id], A = getAttempt(c);
  A.graded = true;
  const s = c.test.reduce((n, q, i) => n + (A.ans[i] === q.a ? 1 : 0), 0);
  if (!best[id] || s > best[id].s){ best[id] = { s, t: c.test.length }; store.set("best", best); }
  refreshTest(c);
  renderNav(id); renderMeter();
  const pill = document.querySelector(".chh .eyebrow .pill");
  if (pill){ const st = statusText(c); pill.className = "pill " + st.cls; pill.textContent = st.t; }
}
function retake(id){ delete attempts[id]; refreshTest(byId[id]); }
function refreshTest(c){
  const box = document.getElementById("test-" + c.id);
  box.innerHTML = renderTest(c);
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
}

function route(){
  let id = (location.hash || "").replace("#", "");
  if (!byId[id] && id !== "arxi") id = store.get("last", "arxi");
  if (!byId[id] && id !== "arxi") id = "arxi";
  store.set("last", id);
  const main = document.getElementById("main");
  main.innerHTML = id === "arxi" ? renderHome() : id === "final" ? renderFinal() : renderChapter(byId[id]);
  renderNav(id); renderMeter();
}
function go(id){
  if (location.hash === "#" + id) route(); else location.hash = id;
  window.scrollTo({top: 0});
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go); return; }
  const gr = e.target.closest("[data-grade]"); if (gr){ grade(gr.dataset.grade); return; }
  const rt = e.target.closest("[data-retake]"); if (rt){ retake(rt.dataset.retake); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches('input[type="checkbox"][data-key]')){
    if (t.checked) done[t.dataset.key] = true; else delete done[t.dataset.key];
    store.set("done", done);
    t.closest("li").classList.toggle("done", t.checked);
    const cur = (location.hash || "#arxi").slice(1);
    renderNav(byId[cur] ? cur : "arxi");
  }
  if (t.matches('input[type="radio"]')){
    const box = t.closest("[data-test]"); const id = box.dataset.test;
    const qi = +t.name.split("-").pop();
    const A = getAttempt(byId[id]); A.ans[qi] = +t.value;
    const cnt = document.getElementById("count-" + id);
    if (cnt) cnt.textContent = `Απάντησες ${Object.keys(A.ans).length} από ${byId[id].test.length}`;
  }
});
window.addEventListener("hashchange", route);
route();
})();

</script>

</body>
